# Every pull request to main: lint, format, types, Vitest, Playwright and the app image build.
# main is protected: a pull request merges only when all these jobs are green.
name: CI

on:
  pull_request:
    branches: [main]

# A new push to the pull request cancels the checks of the previous one.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Lint, format, types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck

  vitest:
    name: Vitest
    runs-on: ubuntu-latest
    services:
      # A throwaway database server that lives only while the job runs: no password is needed.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: personal_crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d personal_crm"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # The tests create and use personal_crm_test next to this database.
      DATABASE_URL: postgres://postgres@localhost:5432/personal_crm
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  playwright:
    name: Playwright
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: personal_crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d personal_crm"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # The e2e server and tests create and use personal_crm_e2e_test next to this database.
      DATABASE_URL: postgres://postgres@localhost:5432/personal_crm
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps --no-shell chromium
      - run: pnpm test:e2e
      # The report with traces and screenshots of failed tests: download it from the run page.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  image:
    name: Image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # The same image the deploy builds, only not pushed anywhere.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

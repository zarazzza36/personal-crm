# Every push to main: build one image, then deploy it to prod and staging.
# The deploy itself is deploy/app/deploy.sh; this workflow copies the whole deploy/ folder
# to the server and runs it.
name: Deploy

on:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy ${{ matrix.target }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: prod
            app_dir: personal-crm
          - target: staging
            app_dir: personal-crm-staging
    concurrency:
      group: deploy-${{ matrix.target }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - name: Set up SSH to the server
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host server
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 30
          EOF
      - name: Copy the deploy folder to the server
        shell: bash
        env:
          APP_DIR: ${{ matrix.app_dir }}
        run: |
          remote_script='
            set -e
            cd "$1"
            exec 9>.deploy.lock
            flock 9
            upload=$(mktemp -d .deploy.XXXXXXXXXX)
            cleanup() { rm -rf -- "$upload"; }
            trap cleanup EXIT
            tar -C "$upload" -xf -
            if [ -d deploy ]; then mv deploy "$upload/previous"; fi
            if ! mv "$upload/deploy" deploy; then
              if [ -d "$upload/previous" ]; then mv "$upload/previous" deploy; fi
              exit 1
            fi'
          tar -cf - deploy | ssh server "bash -c '$remote_script' _ '$APP_DIR'"
      - name: Deploy
        env:
          TARGET: ${{ matrix.target }}
          APP_DIR: ${{ matrix.app_dir }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | ssh server "bash '$APP_DIR/deploy/app/deploy.sh' '$TARGET' '$IMAGE' '${{ github.actor }}'"

# The app on the server: compose project "prod", run by deploy.sh.
# The landing shares the project, so every name here starts with "crm-".
# Values come from .env next to this file; CRM_IMAGE is set by deploy.sh.

x-database-url: &database-url postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@crm-postgres:5432/${POSTGRES_DB}

services:
  crm-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is not set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is not set in .env}
    volumes:
      - crm-postgres-data:/var/lib/postgresql/data
    networks: [crm]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-off: deploy.sh runs it before starting a new image and stops on failure.
  crm-migrate:
    image: ${CRM_IMAGE:?CRM_IMAGE is not set}
    profiles: [deploy]
    working_dir: /app/migrate
    command: ["node", "migrate.mts"]
    environment:
      DATABASE_URL: *database-url
    networks: [crm]
    depends_on:
      crm-postgres:
        condition: service_healthy

  crm-app:
    image: ${CRM_IMAGE:?CRM_IMAGE is not set}
    restart: unless-stopped
    environment:
      DATABASE_URL: *database-url
    # Only nginx on the same server reaches the app; it serves app.volki-lzkv.ru.
    ports:
      - "127.0.0.1:3100:3000"
    networks: [crm]
    depends_on:
      crm-postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s

volumes:
  crm-postgres-data:

networks:
  crm:

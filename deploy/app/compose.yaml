# Shared by the prod and staging Compose projects. Each has its own .env,
# network and database volume. common.sh sets the domain, port and limits.

x-database-url: &database-url postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@crm-postgres:5432/${POSTGRES_DB}
x-logging: &logging
  driver: journald

services:
  crm-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    mem_limit: ${CRM_DB_MEMORY:-0}
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is not set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is not set in .env}
    volumes:
      - crm-postgres-data:/var/lib/postgresql/data
    networks: [crm]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-off: deploy.sh runs it before starting a new image and stops on failure.
  crm-migrate:
    image: ${CRM_IMAGE:?CRM_IMAGE is not set}
    mem_limit: ${CRM_MIGRATE_MEMORY:-0}
    logging: *logging
    profiles: [deploy]
    working_dir: /app/migrate
    command: ["node", "migrate.mts"]
    environment:
      DATABASE_URL: *database-url
      OWNER_EMAIL: ${OWNER_EMAIL:-}
    networks: [crm]
    depends_on:
      crm-postgres:
        condition: service_healthy

  crm-app:
    image: ${CRM_IMAGE:?CRM_IMAGE is not set}
    restart: unless-stopped
    mem_limit: ${CRM_APP_MEMORY:-0}
    logging: *logging
    environment:
      DATABASE_URL: *database-url
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is not set}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is not set}
      SMTP_URL: ${SMTP_URL:?SMTP_URL is not set}
    # Only nginx and local health checks reach the app directly.
    ports:
      - "127.0.0.1:${CRM_PORT:?CRM_PORT is not set}:3000"
    networks: [crm]
    depends_on:
      crm-postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s

volumes:
  crm-postgres-data:

networks:
  crm:
